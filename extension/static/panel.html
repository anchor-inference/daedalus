<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<header class="strip">
  <span id="phase" class="phase"><span class="dot"></span><span id="phase-text" class="phase-text"></span></span>
  <span class="brand" data-i18n="brand"></span>
  <span class="grow"></span>
  <button id="open-app" class="icon" data-i18n-title="panel.open_app" hidden></button>
  <button id="toggle-settings" class="icon" data-i18n-title="panel.settings" aria-pressed="false" hidden></button>
</header>

<main id="stage" hidden>
  <iframe id="frame" hidden sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads" allow="clipboard-read; clipboard-write; microphone"></iframe>
  <div id="frame-error" class="center" hidden>
    <p data-i18n="panel.frame_failed"></p>
    <div><button id="retry" class="primary" data-i18n="panel.retry"></button></div>
  </div>
</main>

<section id="settings">
<p id="lead" class="lead" data-i18n="panel.lead" hidden></p>
<p id="error" class="error" hidden></p>
<p id="notice" class="notice" hidden></p>

<dl class="rows">
  <dt data-i18n="row.transport"></dt><dd id="transport"></dd>
  <dt data-i18n="row.install"></dt><dd id="install"></dd>
  <dt data-i18n="row.version"></dt><dd id="version"></dd>
  <dt data-i18n="row.heartbeat"></dt><dd id="heartbeat"></dd>
  <dt data-i18n="row.tabs"></dt><dd id="tabs"></dd>
</dl>

<div class="check">
  <button id="check" class="primary" data-i18n="check.button"></button>
  <span id="check-result"></span>
</div>

<h2 data-i18n="groups.title"></h2>
<p id="groups-empty" class="muted" data-i18n="groups.empty"></p>
<ul id="groups" class="groups"></ul>

<h2 data-i18n="settings.title"></h2>
<div class="field">
  <label for="name" data-i18n="settings.name"></label>
  <div class="inline"><input id="name" maxlength="60"><button id="save-name" data-i18n="settings.save"></button></div>
</div>
<div class="field">
  <label for="server" data-i18n="settings.address"></label>
  <input id="server" placeholder="daedalus.example.org" autocomplete="off">
  <label for="code" data-i18n="settings.code"></label>
  <div class="inline"><input id="code" autocomplete="off" inputmode="numeric"><button id="pair" data-i18n="settings.pair"></button></div>
</div>
<div class="inline actions">
  <button id="use-native" data-i18n="settings.connect_native"></button>
  <button id="disconnect" data-i18n="settings.disconnect"></button>
</div>
<label class="toggle"><input type="checkbox" id="window-mode"><span data-i18n="settings.window_mode"></span></label>
<p class="muted small" data-i18n="settings.window_hint"></p>
<p class="muted small" data-i18n="settings.shortcut"></p>
</section>

<script type="module" src="panel.js"></script>
</body>
</html>
