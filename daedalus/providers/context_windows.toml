# How many tokens a model accepts in one request — the prompt and the reply together — by model
# family. The context-window resolver falls back on this table when the provider's own model listing
# says nothing (a plain OpenAI-compatible /models names ids only) and models.dev has no entry.
#
# Keys are shell-style patterns over the model id, lower-cased, with any "vendor/" prefix and any
# ":tag" suffix removed ("anthropic/claude-opus-4-6" and "llama3.1:8b" are matched as
# "claude-opus-4-6" and "llama3.1"). The most specific pattern wins: the one with the most characters
# that are not wildcards. Only numbers the vendor publishes belong here; a family whose window
# depends on how it is served (an open model behind someone's server) is better left to the
# listing, and an entry missing costs less than an entry wrong: a window set too large is a request
# the provider refuses, which the resolver then learns from, but only after a failed turn.
#
# To add a model: one line, the pattern and the number of tokens. Nothing else reads this file.

[windows]
# Anthropic. The Models API also reports this as max_input_tokens, which the listing reads first.
"claude-fable-5*" = 1_000_000
"claude-mythos-5*" = 1_000_000
"claude-opus-5*" = 1_000_000
"claude-opus-4-6*" = 1_000_000
"claude-opus-4-7*" = 1_000_000
"claude-opus-4-8*" = 1_000_000
"claude-opus-4*" = 200_000
"claude-sonnet-5*" = 1_000_000
"claude-sonnet-4-6*" = 1_000_000
"claude-sonnet-4*" = 200_000
"claude-haiku-5*" = 1_000_000
"claude-haiku-4*" = 200_000
"claude-3*" = 200_000

# OpenAI, through the API. The ChatGPT (Codex) login reports its own windows in the listing.
"gpt-4o*" = 128_000
"gpt-4.1*" = 1_047_576
"gpt-5" = 400_000
"gpt-5-*" = 400_000
"gpt-5.1*" = 400_000
"gpt-5.2*" = 400_000
"o1*" = 200_000
"o3*" = 200_000
"o4-mini*" = 200_000
"gpt-oss-*" = 131_072

# Google
"gemini-1.5-pro*" = 2_097_152
"gemini-1.5-flash*" = 1_048_576
"gemini-2.0-*" = 1_048_576
"gemini-2.5-*" = 1_048_576
"gemini-3-*" = 1_048_576

# xAI
"grok-4-fast*" = 2_000_000
"grok-4*" = 256_000
"grok-code-fast*" = 256_000
"grok-3*" = 131_072

# DeepSeek: the hosted API serves 128K for both of its names.
"deepseek-chat" = 128_000
"deepseek-reasoner" = 128_000

# Alibaba Qwen. The plain Qwen3 checkpoints are native 32K (longer only with a rope-scaling setting
# the server chooses); the 2507 refreshes, Coder, Next and Max are 256K.
"qwen3-coder*" = 262_144
"qwen3-max*" = 262_144
"qwen3-next*" = 262_144
"qwen3-*-2507*" = 262_144
"qwen3*" = 32_768

# Moonshot Kimi
"kimi-k2-thinking*" = 262_144
"kimi-k2-0905*" = 262_144
"kimi-k2*" = 131_072

# Zhipu GLM
"glm-4.5*" = 131_072
"glm-4.6*" = 200_000

# Meta Llama 3.1 – 3.3 (both the hosted and the Ollama spelling)
"llama-3.1*" = 131_072
"llama-3.2*" = 131_072
"llama-3.3*" = 131_072
"llama3.1*" = 131_072
"llama3.2*" = 131_072
"llama3.3*" = 131_072
"meta-llama-3.1*" = 131_072

# Mistral
"mistral-large*" = 131_072
"mistral-medium*" = 131_072
"codestral*" = 256_000

# MiniMax
"minimax-m2*" = 204_800
"minimax-m1*" = 1_000_000
