# daedalus-cli: tested on the three systems and built for six targets on every change to it or to the
# parts of ptyd it imports (the side channels and what they need).
#
# The six archives cli/scripts/package.sh makes (daedalus-cli-<os>-<arch>.tar.gz for Linux and macOS,
# .zip for Windows) are kept as the run's artifact, daedalus-cli. The client has no release of its
# own: desktop.yml calls this workflow on a desktop-v* tag with the tag as the version, and attaches
# the same archives to that draft release, inside its SHA256SUMS and so under its signature.
name: cli

on:
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "ptyd/sidechan/**"
      - "ptyd/internal/procenv/**"
      - "ptyd/internal/config/**"
      - "ptyd/internal/ptyproc/**"
      - "ptyd/proto/procstat/**"
      - "ptyd/go.mod"
      - "ptyd/go.sum"
      - ".github/workflows/cli.yml"
  pull_request:
    paths:
      - "cli/**"
      - "ptyd/sidechan/**"
      - "ptyd/internal/procenv/**"
      - "ptyd/internal/config/**"
      - "ptyd/internal/ptyproc/**"
      - "ptyd/proto/procstat/**"
      - "ptyd/go.mod"
      - "ptyd/go.sum"
      - ".github/workflows/cli.yml"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "The desktop-vX.Y.Z tag being released; the client takes its version."
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # The race detector needs cgo, which the Windows runner's toolchain is not set up for; there
      # the tests run without it.
      - name: Test with the race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - name: Test
        if: runner.os == 'Windows'
        run: go test ./...

  build:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build and pack every target
        working-directory: cli
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$TAG" ]; then
            version="${TAG#desktop-v}"
          else
            version="0.1.0-dev+${GITHUB_SHA::12}"
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
          scripts/package.sh "$version" dist
      - name: The Linux build runs and names its version
        working-directory: cli
        run: |
          mkdir -p "$RUNNER_TEMP/unpacked"
          tar -xzf dist/daedalus-cli-linux-amd64.tar.gz -C "$RUNNER_TEMP/unpacked"
          test "$(tar -tzf dist/daedalus-cli-linux-amd64.tar.gz | LC_ALL=C sort | tr '\n' ' ')" = "LICENSE daedalus-cli "
          test "$(unzip -Z1 dist/daedalus-cli-windows-amd64.zip | LC_ALL=C sort | tr '\n' ' ')" = "LICENSE daedalus-cli.exe "
          "$RUNNER_TEMP/unpacked/daedalus-cli" version | tee "$RUNNER_TEMP/said"
          test "$(cat "$RUNNER_TEMP/said")" = "daedalus-cli $VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-cli
          path: cli/dist/
          if-no-files-found: error
