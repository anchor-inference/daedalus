# The desktop application: built and tested on every change to it, released on a desktop-v* tag.
#
# What is built, for each system, is the application (desktop/shell, Electron: the window, the
# menu entry, the icon) with the launcher beside it (desktop/, Go: the setup, the runtime, the
# update manager), the launcher's three daemons, the built Mini App, the Chrome extension's release
# that desktop/extension.lock pins (built in its own repository, daedalus-chrome-extension) and the
# agent-desktop release that desktop/agent-desktop.lock pins (vercel-labs/agent-desktop, the program
# deskd runs for the accessibility tree) — and from that one build both the installer an operator
# runs and the archive the launcher's own `upgrade` installs from:
#
#   Windows  Daedalus-Setup-x64.exe (one window, per user, no administrator), and
#            daedalus-desktop-windows-amd64.zip, the same files unpacked;
#   macOS    Daedalus-macOS.dmg (drag to Applications), and Daedalus-macOS.zip, the same bundle;
#   Linux    Daedalus-linux-<arch>.deb and Daedalus-linux-<arch>.AppImage, and
#            daedalus-desktop-linux-<arch>.tar.gz, the same files unpacked.
#
# The archives keep the names every launcher since v0.10 looks for, so an installation from any
# of them upgrades into the application. Every file goes into SHA256SUMS, and the operator's one
# signature over it (desktop/SIGNING.md) covers installers and archives alike — and with them the
# seed each one carries (desktop/seed.go): the code at the release's commit, the pinned runtime and
# uv's packages for its lock, so that a first run downloads none of it.
#
# The release carries the terminal client too, built and tested by cli.yml (called here, on a tag
# only) with the tag's version — six archives, flat, holding the program and LICENSE:
#
#   daedalus-cli-linux-amd64.tar.gz    daedalus-cli-linux-arm64.tar.gz
#   daedalus-cli-darwin-amd64.tar.gz   daedalus-cli-darwin-arm64.tar.gz
#   daedalus-cli-windows-amd64.zip     daedalus-cli-windows-arm64.zip
#
# They go into the same SHA256SUMS and so under the same signature, which is what
# cli/scripts/install.sh and install.ps1 check before they install one. A launcher looks for its own
# archive's line in SHA256SUMS and ignores the rest, so the extra lines change nothing for it.
#
# The launcher is plain Go and cross-compiled for every system from one Linux runner. ptyd is Go with
# a C library (the screen emulator, built with the pinned Zig): Linux and Windows cross-compiled on
# the Linux runner, the Mac on the Mac runner. browserd is plain Go. deskd, the desktop daemon, is
# plain Go on Linux and Windows and needs cgo on the Mac (CoreGraphics and the accessibility API), so
# it is built like ptyd: Linux and Windows on the Linux runner, both Macs on the Mac runner.
# agent-desktop is not built here at all: its released archives are downloaded, held to the lock's
# digests and to their build provenance, and unpacked once on the Linux runner. The
# application is packaged on each system's own runner — rcedit, NSIS, hdiutil and codesign want their
# own systems — and its installer is installed, started and removed there before anything is
# published.
name: desktop

# Everything up to the installers' own tests runs on every change to the application, not only on a
# tag: a first install that happens during a release is an install that has nowhere to go but the
# release. Only the last job publishes, and only on a tag.
on:
  push:
    tags: ["desktop-v*"]
    branches: [main]
    paths: ["desktop/**", "ptyd/**", "browserd/**", "deskd/**", "scripts/desktop_package_evidence.py", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "ptyd/**", "browserd/**", "deskd/**", "scripts/desktop_package_evidence.py", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # A tag is the version; any other build is 0.0.0 and the launcher's dev-<commit>, which never
  # asks for updates.
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}

jobs:
  # The launcher's tests, and the shell's, on the runner that has nothing to install.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: test -z "$(gofmt -l .)"
        working-directory: desktop
      - run: go vet ./...
        working-directory: desktop
      - run: go test ./...
        working-directory: desktop
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: The shell's own tests
        working-directory: desktop/shell
        run: |
          npm ci --no-audit --no-fund
          npm test

  # And on the two systems the Linux runner cannot stand in for. There the data is protected by the
  # verified backup, not by the Linux writer fence, and that path — the backup, its check, the
  # rollback, the bridge from an old launcher, the move of an older installation's data into the
  # per-user folder — is the only protection those installations have; this is where it runs on the
  # real systems. On Windows the tests also run install.ps1 once, under Windows PowerShell, against a
  # release served on loopback (installer_ps_run_test.go).
  platforms:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
        working-directory: desktop
      - run: go test ./...
        working-directory: desktop

  # The daemon's tests on each system it ships for. Linux and the Mac build the emulator and test with
  # it; Windows tests without cgo, which is what runs its pseudoconsole and job object for real — the
  # daemon's Windows half is otherwise only cross-compiled, and this job is the first place it runs.
  ptyd-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: ptyd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ptyd/go.mod
          cache-dependency-path: ptyd/go.sum
      - name: Test with the emulator
        if: runner.os != 'Windows'
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          PKG_CONFIG_PATH="$(libghostty/build.sh)"
          export PKG_CONFIG_PATH
          test -z "$(gofmt -l cmd internal proto sidechan)"
          go vet ./...
          go test ./...
          GOOS=windows go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...
      - name: Test the pseudoconsole
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...

  ptyd:
    needs: [ptyd-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            targets: "linux/amd64 linux/arm64 windows/amd64"
          - runner: macos-latest
            targets: "darwin/amd64 darwin/arm64"
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ptyd/go.mod
          cache-dependency-path: ptyd/go.sum
      - name: Build
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          mkdir -p ptyd-dist
          for t in ${{ matrix.targets }}; do
            goos=${t%/*} goarch=${t#*/}
            out="ptyd-dist/ptyd-$goos-$goarch"
            case "$goos" in windows) out="$out.exe";; esac
            ptyd/release.sh "$goos" "$goarch" "$PWD/$out"
          done
          ls -l ptyd-dist
      - uses: actions/upload-artifact@v4
        with:
          name: ptyd-${{ runner.os }}
          path: ptyd-dist
          retention-days: 3

  # The browser daemon: its tests, and its release builds. The tests that drive a real Chromium are
  # skipped here (they need BROWSERD_TEST_CHROMIUM); its Windows and macOS halves are vetted, which is
  # where a platform file that does not compile shows first.
  browserd:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: browserd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: browserd/go.mod
          cache-dependency-path: browserd/go.sum
      - name: Test
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      - name: Build
        run: |
          mkdir -p ../browserd-dist
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            goos=${t%/*} goarch=${t#*/}
            out="$PWD/../browserd-dist/browserd-$goos-$goarch"
            case "$goos" in windows) out="$out.exe";; esac
            ./release.sh "$goos" "$goarch" "$out"
          done
          ls -l ../browserd-dist
      - uses: actions/upload-artifact@v4
        with:
          name: browserd
          path: browserd-dist
          retention-days: 3

  # The desktop daemon: its tests and its release builds, on the system each build is for where it
  # needs one. On Linux the X11 tests start an Xvfb of their own when one is installed and are skipped
  # otherwise; the Windows half is vetted there. On the Mac the cgo half is compiled and its pure parts
  # tested; nothing here drives the runner's real screen, which has no grants to give.
  deskd:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            targets: "linux/amd64 linux/arm64 windows/amd64"
            cgo: "0"
          - runner: macos-latest
            targets: "darwin/amd64 darwin/arm64"
            cgo: "1"
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: deskd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: deskd/go.mod
          cache-dependency-path: deskd/go.sum
      - name: Test
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
          if [ "$RUNNER_OS" = Linux ]; then
            GOOS=windows go vet ./...
            GOOS=darwin go vet ./...
          fi
      - name: Build
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          if [ "$IS_RELEASE" = true ]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::12}"; fi
          mkdir -p ../deskd-dist
          for t in ${{ matrix.targets }}; do
            goos=${t%/*} goarch=${t#*/}
            out="$PWD/../deskd-dist/deskd-$goos-$goarch"
            case "$goos" in windows) out="$out.exe";; esac
            # On the Mac both architectures are built with cgo from the one runner: the Go toolchain
            # hands clang the -arch of the target, and the SDK carries both.
            GOOS=$goos GOARCH=$goarch go build -trimpath \
              -ldflags "-s -w -X github.com/ascorblack/daedalus/deskd/internal/version.Version=$version" -o "$out" ./cmd/deskd
          done
          ls -l ../deskd-dist
      - uses: actions/upload-artifact@v4
        with:
          name: deskd-${{ runner.os }}
          path: deskd-dist
          retention-days: 3

  # agent-desktop, the accessibility backend deskd runs: its release archives for every system, as
  # desktop/agent-desktop.lock pins them. The script refuses an archive whose sha256 is not the lock's,
  # whose build provenance does not verify as the project's release workflow at the pinned commit
  # (gh attestation verify, Sigstore), or which holds anything but the expected files — and a refusal
  # fails this job, so no package is built without it. It is a program of someone else's that will
  # run with Daedalus's Accessibility grant, so it is never executed here: checked, unpacked and
  # passed on, with a SHA256SUMS of the unpacked files that each packaging job checks again. Its own
  # permissions are read-only: nothing it runs needs to write to this repository.
  agent-desktop:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@v4
      - name: Download, verify and unpack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          desktop/stage-agent-desktop.sh agent-desktop-dist
          cat agent-desktop-dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: agent-desktop
          path: agent-desktop-dist
          retention-days: 3

  # The launcher, for every system, from here: no C in it.
  engine:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        working-directory: desktop
        env:
          CGO_ENABLED: "0"
        run: |
          if [ "$IS_RELEASE" = true ]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::12}"; fi
          mkdir -p dist
          for t in linux/amd64 linux/arm64 windows/amd64 darwin/amd64 darwin/arm64; do
            goos=${t%/*} goarch=${t#*/}
            out="dist/daedalus-desktop-$goos-$goarch"
            case "$goos" in windows) out="$out.exe";; esac
            GOOS=$goos GOARCH=$goarch go build -trimpath -ldflags "-s -w -X main.version=$version" -o "$out" .
          done
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: desktop/dist
          retention-days: 3

  # The seed: what a first run used to download, made once here for every system and put in each
  # package. The code is this commit's tree as git archive makes it — the tree codeload serves, the
  # export-ignore rules and all — and the core's main as it is now; the runtime archives are fetched
  # through the launcher's own pinned table and refused on a wrong hash; the package caches are
  # filled from the lock with every wheel checked against it. make-seed ends with a first run on this
  # runner from its own output, offline, and each system's package job does one more on its own.
  seed:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: |
          mkdir -p seed-src
          git archive --format=tar.gz --prefix="daedalus-$GITHUB_SHA/" -o seed-src/daedalus.tar.gz "$GITHUB_SHA"
          git clone --quiet --depth 1 https://github.com/anchor-inference/protocore-exp seed-src/core
          core=$(git -C seed-src/core rev-parse HEAD)
          git -C seed-src/core archive --format=tar.gz --prefix="protocore-exp-$core/" -o "$PWD/seed-src/protocore-exp.tar.gz" HEAD
          cd desktop
          go run . make-seed --out "$GITHUB_WORKSPACE/seed" \
            --platforms windows/amd64,darwin/arm64,darwin/amd64,linux/amd64,linux/arm64 \
            --code ../seed-src/daedalus.tar.gz --code-commit "$GITHUB_SHA" \
            --core ../seed-src/protocore-exp.tar.gz --core-commit "$core"
          du -sh ../seed/*
          cat ../seed/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: seed
          path: seed
          retention-days: 3

  # The app itself, built once and put in every package. A native installation has no image to bake
  # it into and may have no node to build it with, so without this the launcher would fetch a Node
  # toolchain on a first run just to produce a few megabytes of static files.
  miniapp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: miniapp
        run: |
          npm ci --no-audit --no-fund
          npm run build
          du -sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: miniapp-dist
          path: miniapp/dist
          retention-days: 3

  # Windows: the installer, and the archive of the same files. Then the installer is run the way an
  # operator would, silently: installed, started until the window shows the launcher's page,
  # closed with nothing left running, and uninstalled twice — keeping the data, then deleting it.
  app-windows:
    needs: [engine, ptyd, browserd, deskd, agent-desktop, miniapp, seed]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: engine, path: dl/engine }
      - uses: actions/download-artifact@v4
        with: { name: ptyd-Linux, path: dl/ptyd }
      - uses: actions/download-artifact@v4
        with: { name: browserd, path: dl/browserd }
      - uses: actions/download-artifact@v4
        with: { name: deskd-Linux, path: dl/deskd }
      - uses: actions/download-artifact@v4
        with: { name: agent-desktop, path: dl/agent-desktop }
      - uses: actions/download-artifact@v4
        with: { name: miniapp-dist, path: desktop/shell/stage/miniapp-dist }
      # The extension release desktop/extension.lock pins, refused on a wrong digest.
      - run: desktop/stage-extension.sh desktop/shell/stage/browser-extension
      - uses: actions/download-artifact@v4
        with: { name: seed, path: dl/seed }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Package
        working-directory: desktop/shell
        run: |
          if [ "$IS_RELEASE" = true ]; then version="${GITHUB_REF_NAME#desktop-v}"; else version=0.0.0; fi
          # agent-desktop as the agent-desktop job checked it, and its licence for the notices. Not
          # code-signed, like every other executable here: there is no Authenticode certificate.
          (cd ../../dl/agent-desktop && sha256sum -c --quiet SHA256SUMS)
          mkdir -p stage/win-x64 stage/seed-win-x64 stage/notices
          cp ../../dl/agent-desktop/windows-amd64/agent-desktop.exe stage/win-x64/agent-desktop.exe
          cp ../../dl/agent-desktop/THIRD_PARTY_NOTICES.txt stage/notices/
          cp -R ../../dl/seed/manifest.json ../../dl/seed/code ../../dl/seed/windows-amd64 stage/seed-win-x64/
          cp ../../dl/engine/daedalus-desktop-windows-amd64.exe stage/win-x64/daedalus-desktop.exe
          cp ../../dl/ptyd/ptyd-windows-amd64.exe stage/win-x64/ptyd.exe
          cp ../../dl/browserd/browserd-windows-amd64.exe stage/win-x64/browserd.exe
          cp ../../dl/deskd/deskd-windows-amd64.exe stage/win-x64/deskd.exe
          cp ../../docs/brand/avatar-bot.png build/icon.png
          npm ci --no-audit --no-fund
          npx electron-builder --win nsis dir --x64 -c.extraMetadata.version="$version" --publish never
          test -f dist/win-unpacked/agent-desktop.exe
          test -f dist/win-unpacked/THIRD_PARTY_NOTICES.txt
          # The archive the launcher's upgrade installs from: the unpacked application, its items at the
          # top level, names with forward slashes.
          (cd dist/win-unpacked && 7z a -tzip -bd ../daedalus-desktop-windows-amd64.zip . >/dev/null)
          mkdir -p ../../out && mv dist/Daedalus-Setup-x64.exe dist/daedalus-desktop-windows-amd64.zip ../../out/
          ls -l ../../out
      - name: Install, start, close, uninstall
        shell: powershell
        run: desktop/shell/test/windows-smoke.ps1 -Installer out/Daedalus-Setup-x64.exe
      - name: A first run from the seed, with nothing downloaded
        shell: powershell
        timeout-minutes: 20
        run: desktop/shell/test/firstrun-smoke.ps1 -Launcher desktop/shell/dist/win-unpacked/daedalus-desktop.exe -Root "$env:RUNNER_TEMP\firstrun"
      - uses: actions/setup-go@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          go-version: "1.23"
      - name: Install an update from the application
        if: github.event_name == 'workflow_dispatch'
        shell: powershell
        timeout-minutes: 30
        run: desktop/shell/test/windows-upgrade-smoke.ps1 -Archive out/daedalus-desktop-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: app-windows
          path: out
          retention-days: 3

  # Linux: the .deb and the AppImage for both architectures, and the archives of the same files. The
  # x86-64 .deb is then installed on this runner, started under a virtual display until its window
  # shows the launcher's page, closed, and removed — the user's data staying.
  app-linux:
    needs: [engine, ptyd, browserd, deskd, agent-desktop, miniapp, seed]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: engine, path: dl/engine }
      - uses: actions/download-artifact@v4
        with: { name: ptyd-Linux, path: dl/ptyd }
      - uses: actions/download-artifact@v4
        with: { name: browserd, path: dl/browserd }
      - uses: actions/download-artifact@v4
        with: { name: deskd-Linux, path: dl/deskd }
      - uses: actions/download-artifact@v4
        with: { name: agent-desktop, path: dl/agent-desktop }
      - uses: actions/download-artifact@v4
        with: { name: miniapp-dist, path: desktop/shell/stage/miniapp-dist }
      # The extension release desktop/extension.lock pins, refused on a wrong digest.
      - run: desktop/stage-extension.sh desktop/shell/stage/browser-extension
      - uses: actions/download-artifact@v4
        with: { name: seed, path: dl/seed }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Package
        working-directory: desktop/shell
        run: |
          if [ "$IS_RELEASE" = true ]; then version="${GITHUB_REF_NAME#desktop-v}"; else version=0.0.0; fi
          (cd ../../dl/agent-desktop && sha256sum -c --quiet SHA256SUMS)
          mkdir -p stage/notices
          cp ../../dl/agent-desktop/THIRD_PARTY_NOTICES.txt stage/notices/
          for pair in amd64:x64 arm64:arm64; do
            goarch=${pair%:*} arch=${pair#*:}
            mkdir -p "stage/linux-$arch" "stage/seed-linux-$arch"
            cp -R ../../dl/seed/manifest.json ../../dl/seed/code "../../dl/seed/linux-$goarch" "stage/seed-linux-$arch/"
            cp "../../dl/engine/daedalus-desktop-linux-$goarch" "stage/linux-$arch/daedalus-desktop"
            cp "../../dl/ptyd/ptyd-linux-$goarch" "stage/linux-$arch/ptyd"
            cp "../../dl/browserd/browserd-linux-$goarch" "stage/linux-$arch/browserd"
            cp "../../dl/deskd/deskd-linux-$goarch" "stage/linux-$arch/deskd"
            # agent-desktop and the clipboard helper it starts from beside itself.
            cp "../../dl/agent-desktop/linux-$goarch"/* "stage/linux-$arch/"
            # An artifact does not keep the execute bit; the packages and the archives must. 0755
            # exactly, not +x on whatever the umask left: agent-desktop refuses a helper that a group
            # may write.
            chmod 0755 "stage/linux-$arch"/*
          done
          cp ../../docs/brand/avatar-bot.png build/icon.png
          npm ci --no-audit --no-fund
          npx electron-builder --linux deb AppImage dir --x64 --arm64 -c.extraMetadata.version="$version" --publish never
          mkdir -p ../../out
          # The archives the launcher's upgrade installs from: the unpacked application, its items at the
          # top level.
          for pair in amd64:linux-unpacked arm64:linux-arm64-unpacked; do
            goarch=${pair%:*} dir=dist/${pair#*:}
            (cd "$dir" && tar -czf "../../../../out/daedalus-desktop-linux-$goarch.tar.gz" $(ls -A))
          done
          mv dist/*.deb dist/*.AppImage ../../out/
          ls -l ../../out
      - name: The AppImage carries the launcher
        run: |
          cd "$RUNNER_TEMP"
          appimage="$GITHUB_WORKSPACE/out/$(cd "$GITHUB_WORKSPACE/out" && ls Daedalus-linux-*x86_64*.AppImage)"
          "$appimage" --appimage-extract >/dev/null
          if [ "$IS_RELEASE" = true ]; then expected="$GITHUB_REF_NAME"; else expected="dev-${GITHUB_SHA::12}"; fi
          test "$(squashfs-root/daedalus-desktop --version)" = "$expected"
          test -f squashfs-root/miniapp-dist/index.html
          test -f squashfs-root/seed/manifest.json
          test -f squashfs-root/seed/linux-amd64/wheels.tar.gz
          test -x squashfs-root/agent-desktop
          test -x squashfs-root/agent-desktop-linux-clipboard-owner
          test -z "$(find squashfs-root/agent-desktop squashfs-root/agent-desktop-linux-clipboard-owner -perm /022)"
          test -f squashfs-root/THIRD_PARTY_NOTICES.txt
      - name: Install, start, close, remove
        timeout-minutes: 30
        run: |
          deb="$GITHUB_WORKSPACE/out/$(cd out && ls Daedalus-linux-*amd64*.deb)"
          sudo desktop/shell/test/linux-smoke.sh install "$deb"
          desktop/shell/test/firstrun-smoke.sh /opt/Daedalus/daedalus-desktop "$RUNNER_TEMP/firstrun"
          desktop/shell/test/linux-smoke.sh run
          sudo desktop/shell/test/linux-smoke.sh remove "$HOME/.local/share/daedalus/data"
      - name: Record package evidence
        run: |
          if [ "$IS_RELEASE" = true ]; then expected="$GITHUB_REF_NAME" channel=stable; else expected="dev-${GITHUB_SHA::12}" channel=canary; fi
          deb="$GITHUB_WORKSPACE/out/$(cd out && ls Daedalus-linux-*amd64*.deb)"
          appimage="$GITHUB_WORKSPACE/out/$(cd out && ls Daedalus-linux-*x86_64*.AppImage)"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/deb-root"
          python3 scripts/desktop_package_evidence.py --package "$deb" --launcher "$RUNNER_TEMP/deb-root/opt/Daedalus/daedalus-desktop" --target linux-amd64 --channel "$channel" --expected-version "$expected" --passed install --passed start --passed uninstall --passed offline_first_run --output package-evidence/linux-amd64-deb.json
          python3 scripts/desktop_package_evidence.py --package "$appimage" --launcher "$RUNNER_TEMP/squashfs-root/daedalus-desktop" --target linux-amd64 --channel "$channel" --expected-version "$expected" --output package-evidence/linux-amd64-appimage.json
      - uses: actions/upload-artifact@v4
        with:
          name: package-evidence-linux
          path: package-evidence
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: out
          retention-days: 3

  # macOS: one universal application, ad-hoc signed (there is no Developer ID; README says how to
  # open it the first time), in a .dmg to drag into Applications and in the zip the launcher's upgrade
  # installs from. The .dmg is then mounted and its application checked and started.
  app-macos:
    needs: [engine, ptyd, browserd, deskd, agent-desktop, miniapp, seed]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: engine, path: dl/engine }
      - uses: actions/download-artifact@v4
        with: { name: ptyd-macOS, path: dl/ptyd }
      - uses: actions/download-artifact@v4
        with: { name: browserd, path: dl/browserd }
      - uses: actions/download-artifact@v4
        with: { name: deskd-macOS, path: dl/deskd }
      - uses: actions/download-artifact@v4
        with: { name: agent-desktop, path: dl/agent-desktop }
      - uses: actions/download-artifact@v4
        with: { name: miniapp-dist, path: desktop/shell/stage/miniapp-dist }
      # The extension release desktop/extension.lock pins, refused on a wrong digest.
      - run: desktop/stage-extension.sh desktop/shell/stage/browser-extension
      - uses: actions/download-artifact@v4
        with: { name: seed, path: dl/seed }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Package
        working-directory: desktop/shell
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ "$IS_RELEASE" = true ]; then version="${GITHUB_REF_NAME#desktop-v}"; else version=0.0.0; fi
          # The launcher and its daemons as one universal binary each, the same file in both halves of
          # the application, so the universal merge has nothing of theirs to join.
          mkdir -p stage/mac-universal
          lipo -create ../../dl/engine/daedalus-desktop-darwin-amd64 ../../dl/engine/daedalus-desktop-darwin-arm64 -output stage/mac-universal/daedalus-desktop
          lipo -create ../../dl/ptyd/ptyd-darwin-amd64 ../../dl/ptyd/ptyd-darwin-arm64 -output stage/mac-universal/ptyd
          lipo -create ../../dl/browserd/browserd-darwin-amd64 ../../dl/browserd/browserd-darwin-arm64 -output stage/mac-universal/browserd
          lipo -create ../../dl/deskd/deskd-darwin-amd64 ../../dl/deskd/deskd-darwin-arm64 -output stage/mac-universal/deskd
          # agent-desktop and its helper the same way, from the files the agent-desktop job checked.
          # It looks for the helper beside itself, so both go to Contents/MacOS, where the signing
          # below treats them exactly as it treats deskd.
          (cd ../../dl/agent-desktop && shasum -a 256 -c SHA256SUMS)
          for name in agent-desktop agent-desktop-macos-helper; do
            lipo -create "../../dl/agent-desktop/darwin-amd64/$name" "../../dl/agent-desktop/darwin-arm64/$name" -output "stage/mac-universal/$name"
          done
          # 0755 exactly: agent-desktop refuses a helper that a group or other users may write.
          chmod 0755 stage/mac-universal/*
          # Its licence goes to Contents/Resources: a file that is not code has no place in
          # Contents/MacOS, where codesign would take it for code.
          mkdir -p stage/notices
          cp ../../dl/agent-desktop/THIRD_PARTY_NOTICES.txt stage/notices/
          cp -R stage/mac-universal stage/mac-x64
          cp -R stage/mac-universal stage/mac-arm64
          # Both Macs' seeds, the same folder in both halves of the universal application.
          mkdir -p stage/seed-mac
          cp -R ../../dl/seed/manifest.json ../../dl/seed/code ../../dl/seed/darwin-arm64 ../../dl/seed/darwin-amd64 stage/seed-mac/
          cp ../../docs/brand/avatar-bot.png build/icon.png
          npm ci --no-audit --no-fund
          # A Developer ID when all five secrets are there: electron-builder signs with it, with the
          # hardened runtime, and notarizes. Otherwise electron-builder signs nothing — not even with a
          # certificate a runner's keychain happens to hold — and the bundle is signed ad hoc below.
          notarize=""
          if [ -n "$APPLE_CERTIFICATE_P12" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            export CSC_LINK="$APPLE_CERTIFICATE_P12" CSC_KEY_PASSWORD="$APPLE_CERTIFICATE_PASSWORD" APPLE_APP_SPECIFIC_PASSWORD="$APPLE_APP_PASSWORD"
            notarize="-c.mac.notarize=true"
            echo "signing with the Developer ID and notarizing"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "no Developer ID secrets: the application is signed ad hoc"
          fi
          npx electron-builder --mac dir --universal -c.extraMetadata.version="$version" $notarize --publish never
          app=dist/mac-universal/Daedalus.app
          if [ -z "$notarize" ]; then
            # Ad hoc, the whole bundle at once: no timestamp (an ad-hoc signature has none) and no
            # hardened runtime (it would refuse Electron's frameworks, signed by another team). Apple
            # Silicon runs nothing unsigned, and the universal merge left the main executable's
            # signature broken, so this is what makes the application start at all.
            codesign --force --deep --sign - "$app"
          fi
          codesign --verify --deep --strict --verbose=1 "$app"
          mkdir -p ../../out
          # ditto, not zip: the bundle carries symlinks and the signature's extended attributes, and
          # the launcher's upgrade unpacks it as the bundle it was.
          ditto -c -k --keepParent "$app" ../../out/Daedalus-macOS.zip
          # The .dmg: the application and a link to /Applications to drag it onto.
          root="$RUNNER_TEMP/dmg-root"
          rm -rf "$root" && mkdir -p "$root"
          ditto "$app" "$root/Daedalus.app"
          ln -s /Applications "$root/Applications"
          hdiutil create -volname Daedalus -srcfolder "$root" -fs HFS+ -format UDZO -ov ../../out/Daedalus-macOS.dmg
          ls -l ../../out
      - name: Mount the .dmg and check what is in it
        run: |
          mount="$RUNNER_TEMP/dmg"
          hdiutil attach out/Daedalus-macOS.dmg -nobrowse -readonly -mountpoint "$mount"
          test -d "$mount/Daedalus.app"
          test -L "$mount/Applications"
          codesign --verify --deep --strict "$mount/Daedalus.app"
          lipo -archs "$mount/Daedalus.app/Contents/MacOS/Daedalus"
          lipo -archs "$mount/Daedalus.app/Contents/MacOS/daedalus-desktop"
          "$mount/Daedalus.app/Contents/MacOS/daedalus-desktop" --version
          # agent-desktop is signed as deskd is (ad hoc, or the Developer ID when there is one): both
          # architectures, a signature that verifies, and what kind it is, for the log.
          for name in deskd agent-desktop agent-desktop-macos-helper; do
            bin="$mount/Daedalus.app/Contents/MacOS/$name"
            lipo -archs "$bin"
            codesign --verify --strict "$bin"
            codesign -dv "$bin" 2>&1 | grep -E '^(Identifier|Signature|TeamIdentifier|Runtime)' || true
          done
          test -f "$mount/Daedalus.app/Contents/Resources/THIRD_PARTY_NOTICES.txt"
          test -f "$mount/Daedalus.app/Contents/Resources/miniapp-dist/index.html"
          test -f "$mount/Daedalus.app/Contents/Resources/seed/manifest.json"
          test -f "$mount/Daedalus.app/Contents/Resources/seed/darwin-arm64/wheels.tar.gz"
          plutil -extract CFBundleURLTypes xml1 -o - "$mount/Daedalus.app/Contents/Info.plist" | grep -q '<string>daedalus</string>'
          ditto "$mount/Daedalus.app" "$RUNNER_TEMP/Daedalus.app"
          hdiutil detach "$mount"
      - name: Start it until its window shows the launcher's page
        run: |
          DAEDALUS_UPDATE_CHECK=off "$RUNNER_TEMP/Daedalus.app/Contents/MacOS/Daedalus" --remote-debugging-port=9334 >"$RUNNER_TEMP/app.log" 2>&1 &
          page=""
          for _ in $(seq 1 90); do
            page=$(curl -fsS http://127.0.0.1:9334/json/list 2>/dev/null | grep -o '"url": *"http://127.0.0.1:[0-9]*/[^"]*"' | head -1 || true)
            [ -n "$page" ] && break
            sleep 1
          done
          [ -n "$page" ] || { cat "$RUNNER_TEMP/app.log"; exit 1; }
          echo "the window shows $page"
          test -f "$HOME/Library/Application Support/Daedalus/data/launcher.json"
          osascript -e 'quit app "Daedalus"' || kill %1
          for _ in $(seq 1 60); do pgrep -qf 'Daedalus.app/Contents/MacOS/daedalus-desktop' || break; sleep 1; done
          ! pgrep -qf 'Daedalus.app/Contents/MacOS/daedalus-desktop'
      - name: A first run from the seed, with nothing downloaded
        timeout-minutes: 20
        run: desktop/shell/test/firstrun-smoke.sh "$RUNNER_TEMP/Daedalus.app/Contents/MacOS/daedalus-desktop" "$RUNNER_TEMP/firstrun"
      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: out
          retention-days: 3

  # The terminal client, on a tag only: its own workflow tests it on the three systems and packs the
  # six archives, versioned by the tag, as the artifact daedalus-cli.
  cli:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    uses: ./.github/workflows/cli.yml
    with:
      tag: ${{ github.ref_name }}

  # On a tag: every installer and archive, their checksums, the notes, into a draft release.
  release:
    needs: [app-windows, app-linux, app-macos, platforms, cli]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: dist/files
      - uses: actions/download-artifact@v4
        with:
          name: daedalus-cli
          path: dist/cli

      - name: The terminal client's archives
        run: |
          # Checked against the SHA256SUMS they were packed with, then only the six archives join the
          # release: the release's own SHA256SUMS, written next, covers them, and a second checksum
          # file among the assets would be one more name for the installers to confuse.
          (cd dist/cli && sha256sum -c SHA256SUMS)
          cp dist/cli/daedalus-cli-*.tar.gz dist/cli/daedalus-cli-*.zip dist/files/
          ls dist/files/daedalus-cli-*
          test "$(find dist/files -name 'daedalus-cli-*' | wc -l)" -eq 6

      - name: Checksums
        run: |
          cd dist/files
          # Written outside the folder first: a checksum file cannot cover itself, and a glob that
          # expanded after the redirect had made it would try.
          sha256sum ./* | sed 's| \./| |' > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        run: |
          cat > dist/notes.md <<NOTES
          Daedalus on your own machine, as an application of its own: install it, open it from the Start
          menu, Launchpad or the application menu, and it sets itself up in its own window — the mode, the
          keys, the first start — and then shows the app there. Native mode needs nothing else; Docker mode
          needs Docker Desktop (macOS, Windows) or Docker Engine with the compose plugin (Linux), which the
          application never installs for you.

          ### Install it

          | Machine | File | Then |
          |---|---|---|
          | Windows 10 and 11, x86-64 | \`Daedalus-Setup-x64.exe\` | Run it: Next, Install, Finish. It installs for you only, in \`%LOCALAPPDATA%\\\\Programs\\\\Daedalus\`, with no administrator, and puts Daedalus in the Start menu and on the desktop. The installer is not code-signed, so SmartScreen warns once: **More info → Run anyway**. Uninstall it from **Settings → Apps**; it asks whether to delete your data too, and keeps it unless you say so. |
          | macOS 12 and later, Apple Silicon and Intel | \`Daedalus-macOS.dmg\` | Open it and drag **Daedalus** onto **Applications**. The application is signed ad-hoc, not with a Developer ID, so macOS refuses the first opening ("Apple could not verify…"): open it once, then **System Settings → Privacy & Security → Open Anyway**; or in Terminal \`xattr -dr com.apple.quarantine /Applications/Daedalus.app\`. Only the first opening asks. |
          | Debian, Ubuntu and their relatives, x86-64 | \`Daedalus-linux-amd64.deb\` | \`sudo apt install ./Daedalus-linux-amd64.deb\`, or open it with your software centre. Daedalus appears in the application menu. \`sudo apt remove daedalus\` removes it and leaves your data. |
          | Debian, Ubuntu and their relatives, ARM64 | \`Daedalus-linux-arm64.deb\` | The same. |
          | Any Linux, x86-64 | \`Daedalus-linux-x86_64.AppImage\` | Make it executable (\`chmod +x\`, or Properties → Allow executing) and open it. |
          | Any Linux, ARM64 | \`Daedalus-linux-arm64.AppImage\` | The same. |

          Your data — the conversations, the settings, the keys, the checkouts — lives in a folder of your
          own that no installer or update touches: \`%LOCALAPPDATA%\\\\Daedalus\\\\data\` on Windows,
          \`~/Library/Application Support/Daedalus/data\` on macOS, \`~/.local/share/daedalus/data\` on Linux.
          An installation from an earlier archive that kept \`data/\` beside the launcher is moved there by its
          first start, and \`daedalus-desktop import <folder>\` brings one in from anywhere else.

          ### Updating

          The application says when a newer release is out, in its own window and in a notification. On
          Windows, on macOS and from the archives, **Install and restart** installs it: the data is protected
          first (a kept whole copy on Linux with ext4, a checked backup elsewhere), the new version is put in
          place, started and checked, and if it does not come up the data and the previous version are put
          back. The .deb and the AppImage are updated by installing the new release's file the same way.

          ### The terminal client

          \`daedalus-cli\` (also installed as \`dae\`) talks to your Daedalus server from a terminal and runs the
          conversation's tools on that computer, in the folder you start it in. The \`daedalus-cli-<os>-<arch>\`
          archives hold it for Linux and macOS (\`.tar.gz\`) and Windows (\`.zip\`), on x86-64 (\`amd64\`) and
          ARM64 (\`arm64\`). The install scripts pick the right one, check it against the signed \`SHA256SUMS\`
          and put \`daedalus-cli\` and \`dae\` on your PATH:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/cli/scripts/install.sh | sh
          \`\`\`

          \`\`\`powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/cli/scripts/install.ps1 | iex
          \`\`\`

          Then \`daedalus-cli login https://<your server>\` pairs it; Settings → Devices in the app shows the same.

          ### The archives

          \`daedalus-desktop-windows-amd64.zip\`, \`Daedalus-macOS.zip\` and \`daedalus-desktop-linux-*.tar.gz\`
          are the same applications unpacked. Every launcher from v0.10 on upgrades from them
          (\`daedalus-desktop upgrade\`), and they are what the one-line installers fetch:

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/desktop/install.sh | sh
          \`\`\`

          \`\`\`powershell
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/desktop/install.ps1 | iex
          \`\`\`

          \`SHA256SUMS\` covers every file here, installers, archives and the terminal client alike, and \`SHA256SUMS.sig\` signs it
          together with this release's tag, by the project's release key — minisign key id
          \`A18524FA935353DF\`, key line \`RWTfU1OT+iSFoaxGzNfGzkwHdVs2o8WmnCzBUo/LBUw2L4ssGN4xYx/2\`, whose
          SHA-256 (what the installers print as its fingerprint) is
          \`f75fa5a293fdd55b36c794f4787f7af8646e4dac95e19d74e6288e55c357c285\`. The application, the launcher
          and the one-line installers refuse a release that is not signed by it; to check an installer you
          downloaded yourself, desktop/SIGNING.md shows how. [desktop/README.md](https://github.com/${{ github.repository }}/blob/main/desktop/README.md)
          has the folders, the disk the runtime takes, and every command.
          NOTES
          cat dist/notes.md

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Always a draft. A launcher refuses a release without SHA256SUMS.sig by the project's key,
          # and that key is on the operator's machine only, so the release is signed there
          # (desktop/sign-release.sh) and published from there. A release already published is
          # never touched: new files under a signature over the old SHA256SUMS would be refused by
          # every launcher, and replacing both is a new release, not a re-run.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "$GITHUB_REF_NAME is already published; its files are not replaced" >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
          fi
          # A re-run over a draft that was already signed replaces the files and SHA256SUMS; the old
          # signature would then cover checksums that are gone, and every launcher refuses the
          # release. It goes with them, and the draft has to be signed again (desktop/SIGNING.md).
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx 'SHA256SUMS.sig'; then
            gh release delete-asset "$GITHUB_REF_NAME" SHA256SUMS.sig --yes
            echo "::warning::SHA256SUMS.sig was removed from the draft $GITHUB_REF_NAME: sign it again with desktop/sign-release.sh"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/files/* --clobber
