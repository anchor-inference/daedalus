# The desktop launcher, released on a desktop-v* tag as one archive per platform.
#
# Archives and not bare binaries: a browser download carries no execute bit, so a raw Mach-O or ELF
# file is not something a person can double-click, and on macOS Finder opens it in a text editor
# instead. The macOS archive holds an application bundle, signed and — when the secrets are there —
# notarized, so that opening it is the ordinary thing it looks like.
#
# The builds are on native runners and not cross-compiled from one, because the window is the
# operating system's own web view and reaching it means cgo. The exception is Linux, which is built
# with `-tags nowebview` and no cgo at all: a Linux binary linked against WebKitGTK cannot start on
# a machine without it, so the Linux archives keep the browser fallback and keep running everywhere.
# That is also why both Linux architectures still come off one runner.
#
# Each archive also carries ptyd, the terminal daemon a native installation runs for its host
# terminals. It is Go with a C library linked in (the screen emulator, which Zig builds), so it is
# built by ptyd/release.sh rather than by `go build` alone: Linux and Windows cross-compiled from one
# Linux runner with the pinned Zig as the C compiler (Linux fully static against musl, so it starts
# on any distribution), the Mac on the Mac runner with Apple's compiler.
#
# And browserd, the browser daemon a native installation runs for the agent's browser. It is plain
# Go, so browserd/release.sh cross-compiles all six from the Linux runner; the Mac's two slices are
# joined and signed in the bundle beside ptyd's.
name: desktop

# `test` and `window` run on every change to the launcher, not only on a tag: `window` is the only
# place the macOS and Windows halves are compiled at all, and a first compile that happens during a
# release is a compile that has nowhere to go but the release. The two jobs that publish are held
# back to the tag by the `if` on each of them.
on:
  push:
    tags: ["desktop-v*"]
    branches: [main]
    paths: ["desktop/**", "ptyd/**", "browserd/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", "ptyd/**", "browserd/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The tests, on the runner that has nothing to install. On Linux the window's build constraint
  # (`!nowebview && (darwin || windows)`) excludes it, so both commands here compile the same code
  # twice: nothing on this runner can see a mistake in window.go.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go vet ./...
        working-directory: desktop
      - run: go test ./...
        working-directory: desktop
      - run: go vet -tags nowebview ./...
        working-directory: desktop
      - run: go test -tags nowebview ./...
        working-directory: desktop

  # So the window is compiled where it exists, before the tag is built. Without this a syntax error
  # in window.go passes `test` and surfaces in `binaries`, which is after the tag has been pushed.
  #
  # And the tests, on the two systems the Linux runner cannot stand in for. There the data is
  # protected by the verified backup, not by the Linux writer fence, and that path — the backup, its
  # check, the rollback, the bridge from an old launcher — is the only protection those installations
  # have; this is where it runs on the real systems. On Windows the tests also run install.ps1 once,
  # under Windows PowerShell, against a release served on loopback (installer_ps_run_test.go).
  window:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: go build ./...
        working-directory: desktop
      - run: go vet ./...
        working-directory: desktop
      - run: go test ./...
        working-directory: desktop
      - run: go test -tags nowebview ./...
        working-directory: desktop

  # The daemon's tests on each system it ships for. Linux and the Mac build the emulator and test with
  # it; Windows tests without cgo, which is what runs its pseudoconsole and job object for real — the
  # daemon's Windows half is otherwise only cross-compiled, and this job is the first place it runs.
  ptyd-test:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: ptyd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ptyd/go.mod
          cache-dependency-path: ptyd/go.sum
      - name: Test with the emulator
        if: runner.os != 'Windows'
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          PKG_CONFIG_PATH="$(libghostty/build.sh)"
          export PKG_CONFIG_PATH
          test -z "$(gofmt -l cmd internal proto)"
          go vet ./...
          go test ./...
          GOOS=windows go vet ./...
          GOOS=windows GOARCH=arm64 go vet ./...
      - name: Test the pseudoconsole
        if: runner.os == 'Windows'
        env:
          CGO_ENABLED: "0"
        run: |
          go vet ./...
          go test ./...

  ptyd:
    needs: [ptyd-test]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            targets: "linux/amd64 linux/arm64 windows/amd64 windows/arm64"
          - runner: macos-latest
            targets: "darwin/amd64 darwin/arm64"
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ptyd/go.mod
          cache-dependency-path: ptyd/go.sum
      - name: Build
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          mkdir -p ptyd-dist
          for t in ${{ matrix.targets }}; do
            goos=${t%/*} goarch=${t#*/}
            out="ptyd-dist/ptyd-$goos-$goarch"
            case "$goos" in windows) out="$out.exe";; esac
            ptyd/release.sh "$goos" "$goarch" "$PWD/$out"
          done
          ls -l ptyd-dist
      - uses: actions/upload-artifact@v4
        with:
          name: ptyd-${{ runner.os }}
          path: ptyd-dist
          retention-days: 1

  # The browser daemon: its tests on every change, and on a tag its six release builds. The tests
  # that drive a real Chromium are skipped here (they need BROWSERD_TEST_CHROMIUM); its Windows and
  # macOS halves are vetted, which is where a platform file that does not compile shows first.
  browserd:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: browserd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: browserd/go.mod
          cache-dependency-path: browserd/go.sum
      - name: Test
        run: |
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      - name: Build
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        run: |
          mkdir -p ../browserd-dist
          for t in linux/amd64 linux/arm64 windows/amd64 windows/arm64 darwin/amd64 darwin/arm64; do
            goos=${t%/*} goarch=${t#*/}
            out="$PWD/../browserd-dist/browserd-$goos-$goarch"
            case "$goos" in windows) out="$out.exe";; esac
            ./release.sh "$goos" "$goarch" "$out"
          done
          ls -l ../browserd-dist
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        with:
          name: browserd
          path: browserd-dist
          retention-days: 1

  # Not held back by `window`: its macOS and Windows tests are the first to run on those systems,
  # and while they are red a release may still ship the Linux archives alone. What `window` finds
  # is read before the Mac and Windows archives are published, not as a gate on building them.
  binaries:
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both Mac slices come off the Apple Silicon runner and are joined into one universal
          # executable by the packaging job. The Intel slice is a cross-compile on the same machine:
          # Apple's toolchain builds x86_64 from arm64 with one flag, and the Intel runners spend
          # hours in a queue when they exist at all.
          - runner: macos-latest
            goos: darwin
            goarch: arm64
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            arch_flags: "-arch x86_64"
          # The Windows runner has the compiler cgo needs; WebView2 is the user's to have, and the
          # launcher asks the registry for it before it tries to open a window.
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            tags: nowebview
            cgo: "0"
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            tags: nowebview
            cgo: "0"
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Build
        working-directory: desktop
        env:
          VERSION: ${{ github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo || '1' }}
          TAGS: ${{ matrix.tags }}
          CGO_CFLAGS: ${{ matrix.arch_flags }}
          CGO_LDFLAGS: ${{ matrix.arch_flags }}
        run: |
          mkdir -p dist/bin
          out="dist/bin/daedalus-desktop-$GOOS-$GOARCH"
          case "$GOOS" in windows) out="$out.exe";; esac
          echo "building $out"
          go build -tags "$TAGS" -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$out" .
          ls -l "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.goos }}-${{ matrix.goarch }}
          path: desktop/dist/bin
          retention-days: 1

  # The bundle is built on macOS because only macOS has lipo, sips, iconutil, codesign and
  # notarytool. It is the last job, so it is also the one that publishes: the checksums have to
  # cover every archive, including its own.
  package:
    needs: [binaries, ptyd, browserd]
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: desktop/dist/bin

      - uses: actions/download-artifact@v4
        with:
          pattern: ptyd-*
          merge-multiple: true
          path: desktop/dist/ptyd

      - uses: actions/download-artifact@v4
        with:
          name: browserd
          path: desktop/dist/browserd

      # The app itself, built once and put in every archive. A native installation has no image to
      # bake it into and may have no node to build it with, so without this the launcher would fetch
      # a Node toolchain on a first run just to produce 1.7 MB of static files.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the Mini App
        run: |
          cd miniapp
          npm ci --no-audit --no-fund
          npm run build
          du -sh dist

      - name: Pack Linux and Windows
        working-directory: desktop
        run: |
          mkdir -p dist/archives stage
          # The tarball keeps the executable's mode, which is the whole point of shipping one: the
          # file comes out of it runnable, with nothing to chmod first. An artifact does not keep
          # that mode, so it is set again here.
          # ptyd and browserd go beside the launcher, where it looks for them.
          cp -R ../miniapp/dist stage/miniapp-dist
          for arch in amd64 arm64; do
            cp "dist/bin/daedalus-desktop-linux-$arch" stage/daedalus-desktop
            cp "dist/ptyd/ptyd-linux-$arch" stage/ptyd
            cp "dist/browserd/browserd-linux-$arch" stage/browserd
            chmod +x stage/daedalus-desktop stage/ptyd stage/browserd
            tar -czf "dist/archives/daedalus-desktop-linux-$arch.tar.gz" -C stage daedalus-desktop ptyd browserd miniapp-dist
            rm stage/daedalus-desktop stage/ptyd stage/browserd
          done
          cp dist/bin/daedalus-desktop-windows-amd64.exe stage/daedalus-desktop.exe
          cp dist/ptyd/ptyd-windows-amd64.exe stage/ptyd.exe
          cp dist/browserd/browserd-windows-amd64.exe stage/browserd.exe
          (cd stage && zip -qr ../dist/archives/daedalus-desktop-windows-amd64.zip daedalus-desktop.exe ptyd.exe browserd.exe miniapp-dist)
          rm -rf stage
          ls -l dist/archives

      - name: Build, sign and notarize Daedalus.app
        working-directory: desktop
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          chmod +x dist/bin/daedalus-desktop-darwin-* dist/ptyd/ptyd-darwin-* dist/browserd/browserd-darwin-*
          export PTYD_AMD64=dist/ptyd/ptyd-darwin-amd64 PTYD_ARM64=dist/ptyd/ptyd-darwin-arm64
          export BROWSERD_AMD64=dist/browserd/browserd-darwin-amd64 BROWSERD_ARM64=dist/browserd/browserd-darwin-arm64
          MINIAPP_DIST=../miniapp/dist ./package-macos.sh "${{ github.ref_name }}" \
            dist/bin/daedalus-desktop-darwin-amd64 \
            dist/bin/daedalus-desktop-darwin-arm64 \
            dist/app
          mv dist/app/Daedalus-macOS.zip dist/archives/

      - name: Checksums
        working-directory: desktop
        run: |
          cd dist/archives
          # Written outside the folder first: a checksum file cannot cover itself, and a glob that
          # expanded after the redirect had made it would try.
          shasum -a 256 ./* | sed 's| \./| |' > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        working-directory: desktop
        run: |
          if [ "$(cat dist/app/signing.txt)" = "developer-id" ]; then
            mac_open='Double-click **Daedalus** in the folder. The app is signed and notarized, so it opens like any other application.'
          else
            mac_open='Double-click **Daedalus** in the folder. This build is signed ad-hoc rather than with a Developer ID certificate, so macOS refuses a copy that came through a browser ("Apple could not verify…"), and since macOS 15 a right-click **Open** no longer gets past it. Open it once, then **System Settings → Privacy & Security → Open Anyway**; or in Terminal run `xattr -dr com.apple.quarantine Daedalus.app` in the folder. Only the first launch asks. A copy installed with the one-liner below never asks at all.'
          fi
          cat > dist/notes.md <<NOTES
          Daedalus on your own machine: one folder, Docker, and this launcher. It clones the two
          repositories, asks for the keys on a page of its own, starts the stack and opens the app —
          on macOS and Windows in a window of its own, on Linux in a browser window with nothing
          around it. **Docker Desktop (macOS, Windows) or Docker Engine with the compose plugin
          (Linux) has to be installed and running** — the launcher never installs it for you.

          ### Install it in one line — macOS and Linux

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/desktop/install.sh | sh
          \`\`\`

          It picks the right archive, checks it against the checksums below, and unpacks it into
          \`./Daedalus\`.

          ### Or download it

          | Machine | File | Then |
          |---|---|---|
          | macOS (Apple Silicon and Intel) | \`Daedalus-macOS.zip\` | Unzip it into a folder of its own. $mac_open |
          | Linux x86-64 | \`daedalus-desktop-linux-amd64.tar.gz\` | \`tar -xzf\` it into an empty folder and run \`./daedalus-desktop\`. |
          | Linux ARM64 | \`daedalus-desktop-linux-arm64.tar.gz\` | \`tar -xzf\` it into an empty folder and run \`./daedalus-desktop\`. |
          | Windows x86-64 | \`daedalus-desktop-windows-amd64.zip\` | \`Expand-Archive daedalus-desktop-windows-amd64.zip -DestinationPath Daedalus\` in PowerShell, then run \`daedalus-desktop.exe\`. The executable is unsigned, so SmartScreen warns once: **More info → Run anyway**. The window needs the WebView2 runtime, which Windows 11 and any machine with a current Edge already has; without it the launcher opens a browser instead. |

          The launcher makes the checkouts, the keys and the database inside the folder you put it in,
          and natively keeps its downloaded runtime and local state outside it;
          \`daedalus-desktop uninstall\` removes those, and deleting the folder then removes the rest.

          \`SHA256SUMS\` covers every archive here, and \`SHA256SUMS.sig\` signs it together with this
          release's tag, by the project's release key — minisign key id \`A18524FA935353DF\`, key line
          \`RWTfU1OT+iSFoaxGzNfGzkwHdVs2o8WmnCzBUo/LBUw2L4ssGN4xYx/2\`, whose SHA-256 (what the
          installers print as its fingerprint) is
          \`f75fa5a293fdd55b36c794f4787f7af8646e4dac95e19d74e6288e55c357c285\`. The launcher and the
          installers refuse a release that is not signed by it; desktop/SIGNING.md shows how to check
          the signature by hand. [desktop/README.md](https://github.com/${{ github.repository }}/blob/main/desktop/README.md) has the folder layout, the disk the images take, and every command.
          NOTES
          cat dist/notes.md

      - name: Attach them to the release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Always a draft. A launcher refuses a release without SHA256SUMS.sig by the project's key,
          # and that key is on the operator's machine only, so the release is signed there
          # (desktop/sign-release.sh) and published from there. A release already published is
          # never touched: new archives under a signature over the old SHA256SUMS would be refused
          # by every launcher, and replacing both is a new release, not a re-run.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "$GITHUB_REF_NAME is already published; its files are not replaced" >&2
              exit 1
            fi
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes-file dist/notes.md
          fi
          # A re-run over a draft that was already signed replaces the archives and SHA256SUMS; the
          # old signature would then cover checksums that are gone, and every launcher refuses the
          # release. It goes with them, and the draft has to be signed again (desktop/SIGNING.md).
          if gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name' | grep -qx 'SHA256SUMS.sig'; then
            gh release delete-asset "$GITHUB_REF_NAME" SHA256SUMS.sig --yes
            echo "::warning::SHA256SUMS.sig was removed from the draft $GITHUB_REF_NAME: sign it again with desktop/sign-release.sh"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/archives/* --clobber
