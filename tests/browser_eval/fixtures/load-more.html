<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Field notes — Birding club</title>
<style>body{font-family:sans-serif;max-width:760px;margin:2em auto}li{margin:.4em 0}.more{display:inline-block;border:1px solid #444;padding:8px 18px;cursor:pointer;margin-top:1em}</style></head>
<body>
<h1>Members' field notes</h1>
<ul id="notes"></ul>
<div class="more" id="more">Load more</div>
<script>
  let from = 0;
  async function load() {
    const r = await fetch('/notes?from=' + from); const d = await r.json();
    d.items.forEach(n => { const li = document.createElement('li'); li.innerHTML = '<b>' + n.title + '</b> — by ' + n.author; document.getElementById('notes').appendChild(li); });
    from += d.items.length; if (!d.more) document.getElementById('more').remove();
  }
  document.getElementById('more').addEventListener('click', load); load();
</script>
</body></html>
