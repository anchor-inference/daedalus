<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Notepad</title><script src="/eval.js"></script>
<style>body{font-family:sans-serif;max-width:760px;margin:2em auto} textarea{width:100%;height:8em}</style></head>
<body>
<h1>Notepad</h1>
<label for="note">New note</label>
<textarea id="note"></textarea>
<p><button id="save">Save note</button></p>
<ul id="saved"></ul>
<script>
  document.getElementById("save").onclick = () => {
    const text = document.getElementById("note").value.trim();
    if (!text) { alert("Write something first."); return; }
    record("alert-save", "save", { text });
    alert("Note saved.");
    const li = document.createElement("li");
    li.textContent = text;
    document.getElementById("saved").append(li);
    document.getElementById("note").value = "";
  };
</script>
</body></html>
