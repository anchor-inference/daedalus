<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Profile — region settings</title>
<style>body{font-family:sans-serif;max-width:640px;margin:2em auto}label{display:block;margin-top:1em}</style></head>
<body>
<h1>Region settings</h1>
<form method="post" action="/submit/native-select">
<label for="c">Country of residence</label>
<select id="c" name="country"></select>
<label for="cur">Currency</label>
<select id="cur" name="currency"><option>EUR</option><option>USD</option><option>GBP</option><option>CHF</option><option>SEK</option><option>NOK</option><option>DKK</option><option>PLN</option><option>CZK</option></select>
<p><button type="submit">Save settings</button></p>
</form>
<script>
  const names = ['Albania','Andorra','Argentina','Armenia','Australia','Austria','Azerbaijan','Belgium','Bolivia','Bosnia and Herzegovina','Brazil','Bulgaria','Canada','Chile','Colombia','Costa Rica','Croatia','Cyprus','Czechia','Denmark','Ecuador','Estonia','Finland','France','Georgia','Germany','Greece','Hungary','Iceland','Ireland','Israel','Italy','Japan','Kazakhstan','Kenya','Latvia','Liechtenstein','Lithuania','Luxembourg','Malta','Mexico','Moldova','Monaco','Montenegro','Morocco','Netherlands','New Zealand','North Macedonia','Norway','Paraguay','Peru','Poland','Portugal','Romania','San Marino','Serbia','Slovakia','Slovenia','South Africa','South Korea','Spain','Sweden','Switzerland','Tunisia','Turkey','Ukraine','United Kingdom','United States','Uruguay','Vietnam'];
  const sel = document.getElementById('c');
  sel.innerHTML = '<option value="">Select…</option>' + names.map(n => '<option>' + n + '</option>').join('');
</script>
</body></html>
