<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Track your order — Parcelwing</title>
<style>body{font-family:sans-serif;max-width:640px;margin:2em auto}.sk{background:#e5e5e5;height:16px;margin:8px 0;border-radius:4px;animation:p 1s infinite}@keyframes p{50%{opacity:.5}}</style></head>
<body>
<h1>Order PW-77120</h1>
<div id="box"><div class="sk" style="width:60%"></div><div class="sk" style="width:40%"></div><div class="sk" style="width:70%"></div></div>
<script>
  fetch('/order-status').then(r => r.json()).then(d => {
    document.getElementById('box').innerHTML = '<p>Status: <b>' + d.status + '</b></p><p>Estimated delivery: ' + d.eta + '</p><p>Carrier: ' + d.carrier + '</p>';
  });
</script>
</body></html>
