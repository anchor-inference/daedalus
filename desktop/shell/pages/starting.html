<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Daedalus</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1e20; --dim: #6b6d72; --accent: #3b6fd8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101114; --fg: #e8e8ea; --dim: #9a9ca3; --accent: #7aa2f7; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: grid; place-items: center; }
  .box { text-align: center; padding: 16px; }
  .bar { width: 160px; height: 3px; margin: 18px auto 0; border-radius: 3px; background: color-mix(in srgb, var(--dim) 30%, transparent); overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; background: var(--accent); border-radius: 3px; animation: slide 1.2s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
</style>
</head>
<body>
<div class="box"><div id="text"></div><div class="bar"></div></div>
<script>
  document.getElementById('text').textContent = new URLSearchParams(location.search).get('text') || 'Daedalus';
</script>
</body>
</html>
