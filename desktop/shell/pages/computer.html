<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Daedalus</title>
<style>
  /* The note over the desktop while the agent holds it: a small dark pill at the top of the display
     the agent works on. The window around it is transparent and lets clicks through; it is only
     shown on Windows and macOS, where a transparent window is composed rather than drawn black.
     The dot carries the border's colour, so the two read as one sign. */
  html, body { height: 100%; margin: 0; overflow: hidden; cursor: default; user-select: none; background: transparent; }
  body { display: flex; align-items: center; justify-content: center; padding: 0 8px; box-sizing: border-box;
         font: 500 12px/1 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .pill { display: flex; align-items: center; gap: 8px; max-width: 100%; height: 28px; padding: 0 14px 0 11px; box-sizing: border-box;
          border-radius: 14px; color: rgba(255, 255, 255, .94); background: rgba(22, 22, 26, .86);
          border: 1px solid rgba(255, 255, 255, .1); box-shadow: 0 4px 16px rgba(0, 0, 0, .28);
          opacity: 0; transform: translateY(-4px); transition: opacity .16s ease-out, transform .16s ease-out; }
  body.ready .pill { opacity: 1; transform: none; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #d93a3f; flex: none; animation: pulse 1.6s ease-in-out infinite; }
  body.paused .dot { background: #c27c0e; animation: none; }
  #text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .01em; }
  @keyframes pulse { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } .pill { transition: none; transform: none; } }
</style>
</head>
<body>
<div class="pill"><span class="dot"></span><span id="text"></span></div>
<script>
  const query = new URLSearchParams(location.search);
  document.getElementById('text').textContent = query.get('text') || 'Daedalus';
  if (query.get('paused') === '1') document.body.classList.add('paused');
  requestAnimationFrame(() => document.body.classList.add('ready'));
</script>
</body>
</html>
