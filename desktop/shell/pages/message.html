<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Daedalus</title>
<style>
  /* The palette and the face of the app's own neutral theme, as static values: this page is drawn
     before the app is up and has no build step. Violet is the one accent, for the one action. */
  :root { color-scheme: light dark; --bg: #f5f5f4; --fg: #1b1b1b; --dim: #6b6b6b; --line: rgba(0, 0, 0, 0.17); --hair: rgba(0, 0, 0, 0.09); --inset: #f6f6f5; --primary: #6a52e8; --primary-hover: #5b42dc; --ring: #5a41d8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111111; --fg: #ededed; --dim: #8e8e8e; --line: rgba(255, 255, 255, 0.15); --hair: rgba(255, 255, 255, 0.08); --inset: #101010; --primary: #765eee; --primary-hover: #6a51e6; --ring: #a998ff; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.45 "Inter Variable", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
         display: grid; place-items: center; }
  main { max-width: 640px; padding: 24px 16px; }
  h1 { font-size: 20px; font-weight: 500; letter-spacing: -0.015em; margin: 0 0 12px; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--inset);
        border: 1px solid var(--hair); border-radius: 12px; padding: 12px; font: 13px/1.6 "JetBrains Mono Variable", "JetBrains Mono", ui-monospace, Consolas, monospace; }
  .log { color: var(--dim); font-size: 13px; word-break: break-all; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button { font: inherit; font-size: 14px; height: 32px; padding: 0 14px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
  button:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  button.primary { background: var(--primary); border-color: transparent; color: #fff; }
  button.primary:hover { background: var(--primary-hover); }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <pre id="text"></pre>
  <p class="log" id="log" hidden></p>
  <div class="actions">
    <button class="primary" id="retry"></button>
    <button id="open" hidden></button>
  </div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const el = (id) => document.getElementById(id);
  el('title').textContent = q.get('title') || 'Daedalus';
  el('text').textContent = q.get('text') || '';
  el('retry').textContent = q.get('retry') || 'Try again';
  el('retry').addEventListener('click', () => window.daedalus && window.daedalus.retry());
  const log = q.get('log');
  if (log) {
    el('log').hidden = false;
    el('log').textContent = log;
    el('open').hidden = false;
    el('open').textContent = q.get('open') || 'Show the log';
    el('open').addEventListener('click', () => window.daedalus && window.daedalus.openLog(log));
  }
</script>
</body>
</html>
