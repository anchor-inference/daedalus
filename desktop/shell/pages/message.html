<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Daedalus</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1e20; --dim: #6b6d72; --line: #d9d9d4; --accent: #3b6fd8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #101114; --fg: #e8e8ea; --dim: #9a9ca3; --line: #2a2c31; --accent: #7aa2f7; } }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: grid; place-items: center; }
  main { max-width: 640px; padding: 24px 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 12px; }
  pre { white-space: pre-wrap; word-break: break-word; background: color-mix(in srgb, var(--line) 40%, transparent);
        border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: 13px/1.45 ui-monospace, Consolas, monospace; }
  .log { color: var(--dim); font-size: 13px; word-break: break-all; }
  .actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button { font: inherit; padding: 7px 14px; border-radius: 7px; border: 1px solid var(--line); background: transparent; color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <pre id="text"></pre>
  <p class="log" id="log" hidden></p>
  <div class="actions">
    <button class="primary" id="retry"></button>
    <button id="open" hidden></button>
  </div>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const el = (id) => document.getElementById(id);
  el('title').textContent = q.get('title') || 'Daedalus';
  el('text').textContent = q.get('text') || '';
  el('retry').textContent = q.get('retry') || 'Try again';
  el('retry').addEventListener('click', () => window.daedalus && window.daedalus.retry());
  const log = q.get('log');
  if (log) {
    el('log').hidden = false;
    el('log').textContent = log;
    el('open').hidden = false;
    el('open').textContent = q.get('open') || 'Show the log';
    el('open').addEventListener('click', () => window.daedalus && window.daedalus.openLog(log));
  }
</script>
</body>
</html>
